<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 32 32">
  <!-- Mango: una línea gruesa oscura (borde) y encima una más delgada café -->
  <line x1="14" y1="14" x2="29" y2="29" stroke="#3b2414" stroke-width="5" stroke-linecap="round"/>
  <line x1="14" y1="14" x2="29" y2="29" stroke="#8b5a2b" stroke-width="3" stroke-linecap="round"/>

  <!-- Cabeza: un rectángulo girado 45° con dos ranuras -->
  <g transform="rotate(-45 10 10)">
    <rect x="4" y="3" width="12" height="14" rx="2" fill="#b0b0b0" stroke="#333" stroke-width="1.5"/>
    <line x1="8" y1="6" x2="8" y2="14" stroke="#555" stroke-width="1.2"/>
    <line x1="12" y1="6" x2="12" y2="14" stroke="#555" stroke-width="1.2"/>
  </g>
</svg>
